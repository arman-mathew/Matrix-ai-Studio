<script>
const NR=1e7,NC=16384,CW=100,RH=22,HH=24,RW=56;
const $=i=>document.getElementById(i),cv=$('cv'),x=cv.getContext('2d'),ed=$('ed'),fb=$('fb'),nb=$('nb'),gridEl=$('grid');
class Err{constructor(m){this.m=m}}
const E=m=>{throw new Err(m)},clamp=(v,l,h)=>Math.max(l,Math.min(h,v)),K=(r,c)=>r*NC+c;
const ER=/^#[A-Z\/0!?]+$/;
const cn=c=>{let s='';c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=(c-m-1)/26}return s};
const cl=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n-1};
const ns=()=>({n:'Sheet'+(sheets.length+1),d:new Map(),cv:new Map(),rm:new Map(),cm:new Map(),mr:0,mc:0});
let sheets=[],S,undo=[],redo=[],LOG=null,sx=0,sy=0,A=[0,0],Z=[0,0],mode=null,fillT=null,editing=false,W=800,H=500,clip=null,mp=[0,0],hp=null,ctrlFill=false,q=0,rsz=null;
sheets.push(ns());S=sheets[0];
const raw=(r,c)=>S.d.get(K(r,c))??'';
const rh=r=>S.rm.get(r)??RH,cw=c=>S.cm.get(c)??CW;
const rowY=r=>{let y=r*RH;for(const[i,h]of S.rm)if(i<r)y+=h-RH;return y},colX=c=>{let v=c*CW;for(const[i,w]of S.cm)if(i<c)v+=w-CW;return v};
const px=c=>RW+colX(c)-sx,py=r=>HH+rowY(r)-sy;
function idxAt(y,D,M,mx){let ex=0;for(const[i,h]of[...M].sort((a,b)=>a[0]-b[0])){const t=i*D+ex;if(y<t)break;if(y<t+h)return i;ex+=h-D}return clamp(Math.floor((y-ex)/D),0,mx)}
const TH=()=>NR*RH+[...S.rm.values()].reduce((t,h)=>t+h-RH,0),TW=()=>NC*CW+[...S.cm.values()].reduce((t,w)=>t+w-CW,0);
function restore(t,n){t.d=new Map(n.d);t.rm=new Map(n.rm);t.cm=new Map(n.cm);t.mr=n.mr;t.mc=n.mc;t.cv=new Map()}
function setRaw(s,k,v){v===''?s.d.delete(k):(s.d.set(k,v),s.mr=Math.max(s.mr,Math.floor(k/NC)),s.mc=Math.max(s.mc,k%NC));s.cv.clear()}
function put(r,c,v){const k=K(r,c),o=S.d.get(k)??'';if(o===v)return;setRaw(S,k,v);if(LOG)LOG.push([S,k,o,v])}
function tx(f){LOG=[];f();if(LOG.length){undo.push(LOG);redo.length=0}LOG=null;upd()}
function doUndo(){const b=undo.pop();if(!b)return;for(let i=b.length-1;i>=0;i--){const e=b[i];e[0]==='SNAP'?restore(e[1],e[2]):setRaw(e[0],e[1],e[2])}redo.push(b);upd()}
function doRedo(){const b=redo.pop();if(!b)return;for(const e of b)e[0]==='SNAP'?restore(e[1],e[3]):setRaw(e[0],e[1],e[3]);undo.push(b);upd()}
/* ---------- formula engine ---------- */
const TK=/\s*(?:(\d+\.?\d*|\.\d+)|"((?:[^"]|"")*)"|(\$?[A-Z]{1,3}\$?\d+(?::\$?[A-Z]{1,3}\$?\d+)?|[A-Z]{1,3}:[A-Z]{1,3})(?![\w(])|([A-Z][A-Z0-9.]*)(?=\()|(TRUE|FALSE)|(<=|>=|<>|[-+*\/^&=<>(),%]))/iy;
const cell=s=>{const m=/([A-Z]+)(\d+)/.exec(s);return[+m[2]-1,cl(m[1])]};
function pr(s){s=s.replace(/\$/g,'');if(!s.includes(':'))return cell(s);const[a,b]=s.split(':');if(/\d/.test(a)){const p=cell(a),r=cell(b);return[Math.min(p[0],r[0]),Math.min(p[1],r[1]),Math.max(p[0],r[0]),Math.max(p[1],r[1])]}return[0,cl(a),NR-1,cl(b)]}
function num(v){if(typeof v==='number')return v;if(v&&v.g)E('#VALUE!');if(v===''||v===false)return 0;if(v===true)return 1;if(typeof v==='string'){if(ER.test(v))E(v);if(v.trim()!==''&&!isNaN(+v))return+v}E('#VALUE!')}
const fmt=n=>Number.isInteger(n)?String(n):String(+n.toPrecision(12));
const sc=v=>v&&v.g?E('#VALUE!'):typeof v==='number'?fmt(v):v===true?'TRUE':v===false?'FALSE':v;
function val(r,c){const k=K(r,c);if(S.cv.has(k))return S.cv.get(k);const t=S.d.get(k);let v;
 if(t===undefined)v='';else if(t[0]==='='){S.cv.set(k,'#CYCLE!');try{v=calc(t.slice(1));if(v&&v.g)v='#VALUE!'}catch(e){v=e instanceof Err?e.m:'#ERROR!'}}else v=t.trim()!==''&&!isNaN(+t)?+t:t;
 S.cv.set(k,v);return v}
const disp=(r,c)=>{const v=val(r,c);return typeof v==='number'?fmt(v):v===true?'TRUE':v===false?'FALSE':v};
function flat(g){const o=[];for(let r=g[0];r<=Math.min(g[2],S.mr);r++)for(let c=g[1];c<=Math.min(g[3],S.mc);c++)o.push(val(r,c));return o}
function calc(src){const T=[],L=src.trimEnd().length;let p=0,m;while(p<L){TK.lastIndex=p;m=TK.exec(src);if(!m)E('#NAME?');
 if(m[1]!==undefined)T.push(['n',+m[1]]);else if(m[2]!==undefined)T.push(['s',m[2].replace(/""/g,'"')]);else if(m[3])T.push(['r',m[3].toUpperCase()]);else if(m[4])T.push(['f',m[4].toUpperCase()]);else if(m[5])T.push(['b',m[5].toUpperCase()==='TRUE']);else T.push(['o',m[6]]);p=TK.lastIndex}
 return run(T)}
function cmpOp(a,b,o){if(a&&a.g||b&&b.g)E('#VALUE!');if(a===''&&typeof b==='number')a=0;if(b===''&&typeof a==='number')b=0;
 if(typeof a==='string'&&typeof b==='string'){a=a.toLowerCase();b=b.toLowerCase()}else if(typeof a!==typeof b){const rk=v=>typeof v==='number'?0:typeof v==='string'?1:2;a=rk(a);b=rk(b)}
 return o==='='?a===b:o==='<>'?a!==b:o==='<'?a<b:o==='>'?a>b:o==='<='?a<=b:a>=b}
function run(T){if(!T.length)return'';let i=0;const o=(...s)=>T[i]&&T[i][0]==='o'&&s.includes(T[i][1]);
 const prim=()=>{const t=T[i++];if(!t)E('#ERROR!');const k=t[0],v=t[1];
  if(k==='n'||k==='s'||k==='b')return v;
  if(k==='o'&&v==='('){const r=cmp();if(!o(')'))E('#ERROR!');i++;return r}
  if(k==='r'){const g=pr(v);return g.length===2?val(g[0],g[1]):{g}}
  if(k==='f'){if(!o('('))E('#NAME?');let d=0,j=i,a=[],s=i+1;for(;j<T.length;j++){const u=T[j];if(u[0]==='o'){if(u[1]==='(')d++;else if(u[1]===')'){d--;if(!d)break}else if(u[1]===','&&d===1){a.push(T.slice(s,j));s=j+1}}}
   if(j>=T.length)E('#ERROR!');a.push(T.slice(s,j));i=j+1;return call(v,a)}
  E('#ERROR!')};
 const post=()=>{let a=prim();while(o('%')){i++;a=num(a)/100}return a};
 const un=()=>o('-')?(i++,-num(un())):o('+')?(i++,un()):post();
 const pw=()=>{let a=un();while(o('^')){i++;a=num(a)**num(un())}return a};
 const mul=()=>{let a=pw();while(o('*','/')){const p=T[i++][1],b=num(pw());if(p==='/'&&b===0)E('#DIV/0!');a=p==='*'?num(a)*b:num(a)/b}return a};
 const add=()=>{let a=mul();while(o('+','-')){const p=T[i++][1],b=num(mul());a=p==='+'?num(a)+b:num(a)-b}return a};
 const cat=()=>{let a=add();while(o('&')){i++;a=sc(a)+sc(add())}return a};
 const cmp=()=>{let a=cat();while(o('=','<>','<','>','<=','>=')){const p=T[i++][1];a=cmpOp(a,cat(),p)}return a};
 const r=cmp();if(i<T.length)E('#ERROR!');return r}
function mt(c){const m=/^(<=|>=|<>|<|>|=)?([\s\S]*)$/.exec(String(c)),p=m[1]||'=',s=m[2],n=s!==''&&!isNaN(+s)?+s:s.toLowerCase();
 return v=>{const w=typeof v==='string'?v.toLowerCase():v;return p==='='?w===n:p==='<>'?w!==n:typeof w===typeof n&&(p==='<'?w<n:p==='>'?w>n:p==='<='?w<=n:w>=n)}}
const eq=(a,b)=>typeof a==='string'&&typeof b==='string'?a.toLowerCase()===b.toLowerCase():a===b;
function find(k,len,at,exact,type){let hit=-1;for(let i=0;i<len;i++){const y=at(i);if(exact){if(eq(y,k)){hit=i;break}}else{if(y===''||typeof y!==typeof k)continue;if(type<0?y<k:y>k)break;hit=i}}return hit}
function call(f,a){
 if(f==='IF'){const c=run(a[0]);return(c===true||(typeof c==='number'&&c!==0))?run(a[1]):a[2]?run(a[2]):false}
 if(f==='IFERROR'){try{const v=run(a[0]);return typeof v==='string'&&ER.test(v)?run(a[1]):v}catch(e){if(e instanceof Err)return run(a[1]);throw e}}
 const v=a.map(run),n=()=>v.flatMap(z=>z&&z.g?flat(z.g).filter(y=>typeof y==='number'):[num(z)]);
 switch(f){
 case'SUM':return n().reduce((s,y)=>s+y,0);
 case'AVERAGE':{const t=n();if(!t.length)E('#DIV/0!');return t.reduce((s,y)=>s+y,0)/t.length}
 case'MIN':return n().reduce((s,y)=>Math.min(s,y),Infinity);
 case'MAX':return n().reduce((s,y)=>Math.max(s,y),-Infinity);
 case'COUNT':return n().length;
 case'COUNTA':return v.flatMap(z=>z&&z.g?flat(z.g):[z]).filter(y=>y!=='').length;
 case'ROUND':{const d=10**(v[1]===undefined?0:num(v[1]));return Math.round(num(v[0])*d)/d}
 case'ABS':return Math.abs(num(v[0]));case'SQRT':{const t=num(v[0]);if(t<0)E('#NUM!');return Math.sqrt(t)}
 case'INT':return Math.floor(num(v[0]));case'POWER':return num(v[0])**num(v[1]);
 case'MOD':{const b=num(v[1]);if(!b)E('#DIV/0!');const r=num(v[0])%b;return r!==0&&(r<0)!==(b<0)?r+b:r}
 case'AND':return v.every(z=>num(z)!==0);case'OR':return v.some(z=>num(z)!==0);case'NOT':return num(v[0])===0;
 case'CONCAT':case'CONCATENATE':return v.flatMap(z=>z&&z.g?flat(z.g):[z]).map(sc).join('');
 case'UPPER':return sc(v[0]).toUpperCase();case'LOWER':return sc(v[0]).toLowerCase();case'LEN':return sc(v[0]).length;case'TRIM':return sc(v[0]).trim().replace(/\s+/g,' ');
 case'LEFT':return sc(v[0]).slice(0,v[1]===undefined?1:num(v[1]));case'RIGHT':{const s=sc(v[0]),k=v[1]===undefined?1:num(v[1]);return k?s.slice(-k):''}
 case'MID':return sc(v[0]).substr(num(v[1])-1,num(v[2]));
 case'MEDIAN':{const t=n().sort((p,q)=>p-q);if(!t.length)E('#NUM!');const h=t.length>>1;return t.length%2?t[h]:(t[h-1]+t[h])/2}
 case'PRODUCT':return n().reduce((s,y)=>s*y,1);
 case'ROUNDUP':case'ROUNDDOWN':{const d=10**(v[1]===undefined?0:num(v[1])),t=num(v[0])*d;return(f==='ROUNDUP'?Math.sign(t)*Math.ceil(Math.abs(t)):Math.trunc(t))/d}
 case'NOW':return new Date().toLocaleString();case'ISNUMBER':return typeof v[0]==='number';case'ISBLANK':return v[0]==='';
 case'TODAY':return new Date().toISOString().slice(0,10);
 case'SUMIF':case'COUNTIF':{const g=v[0]&&v[0].g;if(!g)E('#VALUE!');const h=f==='SUMIF'&&v[2]&&v[2].g||g,m=mt(v[1]);let s=0,c=0;
  for(let r=g[0];r<=Math.min(g[2],S.mr);r++)for(let k=g[1];k<=Math.min(g[3],S.mc);k++)if(m(val(r,k))){c++;if(f==='SUMIF'){const y=val(h[0]+r-g[0],h[1]+k-g[1]);if(typeof y==='number')s+=y}}return f==='SUMIF'?s:c}
 case'VLOOKUP':case'HLOOKUP':{const g=v[1]&&v[1].g;if(!g)E('#VALUE!');const vt=f==='VLOOKUP',len=(vt?Math.min(g[2],S.mr)-g[0]:Math.min(g[3],S.mc)-g[1])+1,ex=v[3]===false||v[3]===0;
  const hit=find(v[0],len,i=>vt?val(g[0]+i,g[1]):val(g[0],g[1]+i),ex,1);if(hit<0)E('#N/A');const off=num(v[2])-1;if(off<0||off>(vt?g[3]-g[1]:g[2]-g[0]))E('#REF!');
  return vt?val(g[0]+hit,g[1]+off):val(g[0]+off,g[1]+hit)}
 case'XLOOKUP':{const l=v[1]&&v[1].g,t=v[2]&&v[2].g;if(!l||!t)E('#VALUE!');const vt=l[1]===l[3],len=(vt?Math.min(l[2],S.mr)-l[0]:Math.min(l[3],S.mc)-l[1])+1;
  const hit=find(v[0],len,i=>vt?val(l[0]+i,l[1]):val(l[0],l[1]+i),true,0);if(hit<0){if(v[3]!==undefined)return v[3];E('#N/A')}return vt?val(t[0]+hit,t[1]):val(t[0],t[1]+hit)}
 case'MATCH':{const g=v[1]&&v[1].g;if(!g)E('#VALUE!');const vt=g[1]===g[3],ty=v[2]===undefined?1:num(v[2]),len=(vt?Math.min(g[2],S.mr)-g[0]:Math.min(g[3],S.mc)-g[1])+1;
  const hit=find(v[0],len,i=>vt?val(g[0]+i,g[1]):val(g[0],g[1]+i),ty===0,ty);if(hit<0)E('#N/A');return hit+1}
 case'INDEX':{const g=v[0]&&v[0].g;if(!g)E('#VALUE!');let r=g[0]+num(v[1])-1,c=g[1]+(v[2]===undefined?0:num(v[2])-1);if(g[0]===g[2]&&v[2]===undefined){r=g[0];c=g[1]+num(v[1])-1}
  if(r<g[0]||r>g[2]||c<g[1]||c>g[3])E('#REF!');return val(r,c)}

/* ---------- selection helpers ---------- */
const rect=()=>[Math.min(A[0],Z[0]),Math.min(A[1],Z[1]),Math.max(A[0],Z[0]),Math.max(A[1],Z[1])];
function each(g,fn){if((g[2]-g[0]+1)*(g[3]-g[1]+1)<=20000){for(let r=g[0];r<=g[2];r++)for(let c=g[1];c<=g[3];c++)if(S.d.has(K(r,c)))fn(r,c)}
 else for(const k of S.d.keys()){const r=Math.floor(k/NC),c=k%NC;if(r>=g[0]&&r<=g[2]&&c>=g[1]&&c<=g[3])fn(r,c)}}
function upd(){nb.value!==undefined&&document.activeElement!==nb&&(nb.value=cn(A[1])+(A[0]+1));if(document.activeElement!==fb)fb.value=raw(A[0],A[1]);
 let n=0,s=0,cnt=0;each(rect(),(r,c)=>{const v=val(r,c);if(v!==''){cnt++;if(typeof v==='number'){n++;s+=v}}});
 $('st').textContent=cnt>1?`Count ${cnt} · Sum ${fmt(s)} · Avg ${n?fmt(s/n):0}`:'Ready';sched()}
const msg=t=>{$('st').textContent=t;setTimeout(upd,3000)};
function clampS(){sx=Math.max(0,Math.min(sx,TW()-(W-RW-12)));sy=Math.max(0,Math.min(sy,TH()-(H-HH-12)))}
function see(r,c){const vw=W-RW-12,vh=H-HH-12,cx=colX(c),cy=rowY(r),w=cw(c),h=rh(r);if(cx<sx)sx=cx;else if(cx+w>sx+vw)sx=cx+w-vw;if(cy<sy)sy=cy;else if(cy+h>sy+vh)sy=cy+h-vh;clampS()}
function go(r,c,ext){r=clamp(r,0,NR-1);c=clamp(c,0,NC-1);if(ext)Z=[r,c];else{A=[r,c];Z=[r,c]}see(r,c);upd()}
function jump(r,c,dr,dc){const has=(a,b)=>S.d.has(K(a,b)),lim=(a,b)=>a>=0&&a<NR&&b>=0&&b<NC;let a=r+dr,b=c+dc;if(!lim(a,b))return[r,c];
 if(has(r,c)&&has(a,b)){while(lim(a+dr,b+dc)&&has(a+dr,b+dc)){a+=dr;b+=dc}return[a,b]}
 while(lim(a,b)&&!has(a,b)){a+=dr;b+=dc}return lim(a,b)?[a,b]:[clamp(a-dr,0,NR-1),clamp(b-dc,0,NC-1)]}
/* ---------- drawing ---------- */
