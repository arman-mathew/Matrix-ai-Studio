/* ---------------- password (read from GitHub) ---------------- */
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function remotePw(){
 if(PASSWORD_URL.includes('YOUR_USERNAME'))throw new Error('Password URL is not set up yet (edit PASSWORD_URL in index.html)');
 const r=await fetch(PASSWORD_URL+'?t='+Date.now(),{cache:'no-store'});
 if(!r.ok)throw new Error('Could not read the password file ('+r.status+')');
 const t=(await r.text()).replace(/^\uFEFF/,'').trim();
 if(!t)throw new Error('Password file is empty');return t}
async function check(pw){

 if(/^sha256:/i.test(rp)){if(!crypto.subtle)throw new Error('Hashing needs https');return(await sha256(pw))===rp.slice(7).trim().toLowerCase()}

function connect(ws){

  const es=new EventSource(DB_URL+'/w/'+ws+'.json');
  let ready=false,sink=null;const buf=[];
  const fail=m=>{clearTimeout(tm);try{es.close()}catch(e){}reject(new Error(m))};
  const tm=setTimeout(()=>fail('Timed out connecting. Check DB_URL and that the database rules are published.'),15000);
  const route=(type,ev)=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
   if(!ready&&type==='put'&&m&&m.path==='/'){ready=true;clearTimeout(tm);
    resolve({es,data:m.data,attach:fn=>{sink=fn;buf.splice(0).forEach(x=>fn(x[0],x[1]))}});return}
   if(sink)sink(type,m);else if(ready)buf.push([type,m])};
  ['put','patch'].forEach(t=>es.addEventListener(t,ev=>route(t,ev)));

  es.addEventListener('auth_revoked',()=>{if(!ready)fail('Access denied by the database.')});
  es.onerror=()=>{if(!ready)fail('Could not connect to the database. Check DB_URL (and region) in index.html.');else if(sink)sink('error')};

function initSync(ws,conn,stEl){

  const last=p[p.length-1];if(v==null)delete o[last];else o[last]=v;
  };  /* empty containers are left in place on purpose: checking emptiness is O(n) on big maps */
 const MAPS=['d','t','r','c'];
 const sheetById=id=>sheets.find(x=>x.id===id);

 /* ---- cloud -> app ---- */
 function applyKey(id,m,key,v){
  const sh=sheetById(id);if(!sh)return;const k=+key.slice(1);
  if(m==='d')setRaw(sh,k,v==null?'':String(v));
  else if(m==='t'){if(v==null)setSt(sh,k,null);else try{setSt(sh,k,JSON.parse(v))}catch(e){}}
  else if(m==='r'){if(v==null)sh.rm.delete(k);else sh.rm.set(k,+v)}
  else if(m==='c'){if(v==null)sh.cm.delete(k);else sh.cm.set(k,+v)}}
 function diffMap(id,m,o,n){o=o||{};n=n||{};
  for(const k in n)if(o[k]!==n[k])applyKey(id,m,k,n[k]);
  for(const k in o)if(!(k in n))applyKey(id,m,k,null)}
 function reconSheet(id,o,n){
  if(!n){const i=sheets.findIndex(x=>x.id===id);if(i>=0){sheets.splice(i,1);dirtyTabs=true}return}
  const sh=sheetById(id);
  if(!sh){sheets.push(buildSheet(id,n));dirtyTabs=true;return}
  if(n.n!=null&&(!o||o.n!==n.n)&&sh.n!==n.n){sh.n=n.n;dirtyTabs=true}
  for(const m of MAPS)diffMap(id,m,o&&o[m],n[m])}
 function reconAll(o,n){const os=(o&&o.s)||{},nw=(n&&n.s)||{};
  for(const id in nw)reconSheet(id,os[id],nw[id]);
  for(const id in os)if(!(id in nw))reconSheet(id,os[id],null)}
 function onPut(path,data){
  const old=getIn(path);setIn(path,data);const n=getIn(path);const[a,b,c,d]=path;
  if(a==='s'&&path.length>=2&&M.s&&M.s[b]&&!sheetById(b)){sheets.push(buildSheet(b,M.s[b]));dirtyTabs=true;return}
  if(!path.length)reconAll(old,n&&{s:n.s});
  else if(a==='meta')dirtyTabs=true;
  else if(a==='s'){
   if(path.length===1)reconAll({s:old},{s:n});
   else if(path.length===2)reconSheet(b,old,n);
   else if(path.length===3){
    if(c==='n'){const sh=sheetById(b);if(sh&&n!=null&&old!==n&&sh.n!==n){sh.n=n;dirtyTabs=true}}
    else if(MAPS.includes(c))diffMap(b,c,old,n)}
   else if(path.length===4&&MAPS.includes(c)&&old!==n)applyKey(b,c,d,n)}}
 function finish(){
  const ord=((M.meta&&M.meta.order)||'').split(',').filter(Boolean);
  const pos=id=>{const i=ord.indexOf(id);return i<0?1e9:i};
  const before=sheets.map(x=>x.id).join();sheets.sort((x,y)=>pos(x.id)-pos(y.id));
  if(before!==sheets.map(x=>x.id).join())dirtyTabs=true;
  if(!sheets.length){sheets.push(ns());dirtyTabs=true}
  if(!sheets.includes(S)){S=sheets[0];A=[0,0];Z=[0,0];sx=0;sy=0;dirtyTabs=true}
  if(dirtyTabs){tabs();dirtyTabs=false}
  for(const t of sheets)t.cv.clear();
  upd()}
 function handle(type,m){
  if(type==='open'){online=true;setStatus(inflight?'save':'live');touch();return}
  if(type==='error'||type==='cancel'){online=false;setStatus('off');return}
  if(!m)return;const bp=seg(m.path||'/');
  if(type==='put')onPut(bp,m.data);
  else if(type==='patch'&&m.data&&typeof m.data==='object')for(const k in m.data)onPut(bp.concat(seg(k)),m.data[k]);
  finish()}

 /* ---- app -> cloud ---- */
 const sstr=o=>JSON.stringify(o,Object.keys(o).sort());
 function computeOps(){
  const groups=[],deletes=[],ms=M.s||{},ids=new Set(sheets.map(x=>x.id));
  for(const sh of sheets){
   const m=ms[sh.id]||{};
   if(m.n!==sh.n)groups.push(['s/'+sh.id,{n:sh.n}]);
   const cmp=(name,entries,conv)=>{const cur=m[name]||{},b={};let any=false;const seen=new Set();
    for(const[k,v]of entries){const ck='k'+k,nv=conv(v);if(nv===undefined)continue;seen.add(ck);if(cur[ck]!==nv){b[ck]=nv;any=true}}
    for(const ck in cur)if(!seen.has(ck)){b[ck]=null;any=true}
    if(any)groups.push(['s/'+sh.id+'/'+name,b])};
   cmp('d',sh.d,v=>v);
   cmp('t',sh.st,o=>o&&Object.keys(o).length?sstr(o):undefined);
   cmp('r',sh.rm,h=>h);
   cmp('c',sh.cm,w=>w)}
  for(const id in ms)if(!ids.has(id))deletes.push(id);
  const lo=sheets.map(x=>x.id).join(',');
  if((M.meta&&M.meta.order)!==lo)groups.push(['meta',{order:lo}]);
  return{groups,deletes}}
 async function send(method,path,body){
  const r=await fetch(base+'/'+path+'.json?print=silent',{method,body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status)}
 function applyToM(path,part){
  const pp=seg(path),prev=[];
  for(const k in part){const p=pp.concat(k);prev.push([p,getIn(p)]);setIn(p,part[k])}
  return()=>{for(let i=prev.length-1;i>=0;i--)setIn(prev[i][0],prev[i][1])}}
 async function flush(){
  timer=0;
  if(inflight){again=true;return}
  const{groups,deletes}=computeOps();
  if(!groups.length&&!deletes.length){setStatus(online?'live':'off');return}
  inflight=true;setStatus('save');
  try{
   for(const[path,body]of groups){
    const keys=Object.keys(body);
    for(let i=0;i<keys.length;i+=3000){
     const part={};for(const k of keys.slice(i,i+3000))part[k]=body[k];
     const undo=applyToM(path,part);
     try{await send('PATCH',path,part)}catch(e){undo();throw e}}}
   for(const id of deletes){const prev=M.s&&M.s[id];setIn(['s',id],null);
    try{await send('DELETE','s/'+id)}catch(e){setIn(['s',id],prev);throw e}}
   retry=0;online=true}
  catch(e){inflight=false;retry=Math.min(retry+1,6);setStatus('off');clearTimeout(timer);timer=setTimeout(flush,1500*retry);return}
  inflight=false;
  if(again){again=false;touch()}else{setStatus('save');timer=setTimeout(flush,50)}}
 function touch(){clearTimeout(timer);timer=setTimeout(flush,350)}

 window.__sync={touch};
 window.addEventListener('online',touch);
 conn.attach(handle);
 setStatus('live');touch()}
})();

</script>
